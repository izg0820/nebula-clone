# XcodeGen 프로젝트 정의 — `xcodegen generate`로 .xcodeproj 생성
# (XCUITest는 순수 SPM으로 기기 실행이 불가해 Xcode 프로젝트 필요)
# 서명 팀: local.yml(미추적)에 DEVELOPMENT_TEAM 지정 — local.yml.example 참고
name: NebulaController
include:
  - path: local.yml
    optional: true
options:
  bundleIdPrefix: dev.nebula
  deploymentTarget:
    iOS: "16.0"

targets:
  NebulaHost:
    type: application
    platform: iOS
    sources: [Host]
    info:
      path: Host/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Nebula Host
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"

  NebulaControllerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ControllerUITests]
    dependencies:
      - target: NebulaHost
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

schemes:
  NebulaController:
    build:
      targets:
        NebulaHost: all
        NebulaControllerUITests: [test]
    test:
      targets:
        - NebulaControllerUITests
